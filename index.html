<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23685e">
  <meta name="description" content="고디와 함께 배우는 AI 첫걸음. 고디월드 시작의 마을 월드 1 시제품.">
  <title>GDRAGON QUEST · 시작의 마을</title>
  <link rel="icon" href="assets/characters/godragon/neutral.png">
  <link rel="stylesheet" href="css/game.css">
  <script defer src="js/content.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/screens.js"></script>
  <script defer src="js/activities.js"></script>
  <script defer src="js/game.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로 가기</a>
  <div class="game-shell">
    <header id="header" class="game-topbar"></header>
    <main id="main" class="game-main" tabindex="-1"></main>
    <div id="save-status" class="save-status" role="status" aria-live="polite">이 브라우저에 진행 상황을 저장합니다</div>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><h2 id="settings-title">모험 설정</h2><p>이름과 진행 상황은 현재 브라우저에 저장돼요.</p><div class="actions"><button id="save-button" class="secondary">진행 저장</button><button id="fullscreen-button" class="secondary">전체 화면 전환</button><button id="home-button" class="secondary">홈으로</button><button id="reset-button" class="secondary">새 모험 시작</button><button id="close-settings" class="primary">돌아가기</button></div></dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">새로운 모험을 시작할까요?</h2><p>이 브라우저에 저장된 이름과 월드 1 진행 기록이 초기화됩니다.</p><div class="actions"><button id="cancel-reset" class="secondary">취소하고 계속하기</button><button id="confirm-reset" class="danger">초기화하고 시작</button></div></dialog>
  <noscript>이 게임은 JavaScript가 켜진 브라우저에서 실행됩니다. 브라우저 설정을 확인해 주세요.</noscript>
</body>
</html>
